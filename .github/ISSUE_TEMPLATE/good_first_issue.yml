name: "🌱 Good First Issue (Maintainer Curated)"
description: "Maintainer-curated template to create a structured, beginner-friendly contribution"
title: "[Good First Issue] "
labels: ["good first issue", "difficulty:beginner", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🏛️ Maintainer Template: Beginner Micro-Issue Creation

        Use this template when authoring a **Good First Issue**. Every beginner task in PACT must follow the **6-Part Micro-Issue Standard**:
        - **Scope**: One file preferred (max 2), 5–30 min estimated effort.
        - **Guardrails**: No database migrations, auth changes, architectural refactors, or security changes.
        - **No Time Labels**: `time:*` labels are forbidden; use `difficulty:beginner`.

  - type: dropdown
    id: area
    attributes:
      label: "Subsystem / Area"
      description: "Select the architectural area of PACT."
      options:
        - "area:dashboard (Main OS Overview & Metric Cards)"
        - "area:planner (Daily Planner & Timeblocking)"
        - "area:calendar (Calendar View & Google Sync)"
        - "area:tasks (Task Lifecycle & Priority Filters)"
        - "area:goals (OKR Hierarchy & Milestone Tracking)"
        - "area:projects (Projects & Status Boards)"
        - "area:accountability (Stakes, Commitments & Consequence Masking)"
        - "area:focus (Deep Work Timer & Audio Synthesizer)"
        - "area:habits (Habit Recurrence & Streak Engine)"
        - "area:finance (Integer-Cents Transactions & Budgets)"
        - "area:analytics (Velocity Scoring & Completion Trends)"
        - "area:review (Weekly Review Rituals & Drafts)"
        - "area:auth (Login, Registration, Cookies & Onboarding)"
        - "area:integrations (GitHub, LeetCode, Codeforces, Google Calendar)"
        - "area:settings (User Preferences & Profile Configuration)"
        - "area:database (Supabase Migrations, PostgreSQL Triggers & RLS)"
        - "area:testing (Automated Test Suites & Harnesses)"
        - "area:documentation (Guides & Specifications)"
        - "area:developer-experience (Local Setup & Dev Tooling)"
    validations:
      required: true

  - type: dropdown
    id: contribution_type
    attributes:
      label: "Contribution Type"
      description: "Select the primary work type."
      options:
        - "type:docs (Documentation addition, fix, or typo)"
        - "type:ui (UI polish, styling, or card ergonomics)"
        - "type:a11y (Accessibility, focus visible, or ARIA labeling)"
        - "type:test (Unit tests, mock data, or test matrix)"
        - "type:bug (Localized bug fix)"
        - "type:refactor (Small code cleanup or type improvement)"
    validations:
      required: true

  - type: textarea
    id: what_needs_to_be_done
    attributes:
      label: "1. What Needs to Be Done"
      description: "Explain the tiny task in simple, jargon-free language."
      placeholder: "e.g., Add an explicit aria-label='Close notification panel' attribute to the popover close button..."
    validations:
      required: true

  - type: textarea
    id: why_it_matters
    attributes:
      label: "2. Why This Matters"
      description: "Explain the context and value of this change in simple terms."
      placeholder: "Explain why this change improves PACT OS for users or contributors..."
    validations:
      required: true

  - type: input
    id: target_files
    attributes:
      label: "3. Where to Work (Exact File Path)"
      description: "Provide the exact path to the single file (or max 2) that needs editing."
      placeholder: "e.g., src/components/notifications/notification-popover.tsx"
    validations:
      required: true

  - type: textarea
    id: implementation_guidance
    attributes:
      label: "4. Implementation Guidance & Step-by-Step Hints"
      description: "Provide numbered, concrete steps so a first-time contributor can implement the change without reverse-engineering the codebase."
      placeholder: |
        1. Open `src/components/notifications/notification-popover.tsx`
        2. Locate line XX where the close button is defined
        3. Add `aria-label="Close notification panel"` to the button props
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "5. Acceptance Criteria"
      description: "List the exact checklist criteria for this PR to be approved."
      value: |
        - [ ] The specified file is updated with the requested change
        - [ ] Visual appearance, responsiveness, and existing behavior remain intact
        - [ ] `npm run lint` passes with 0 errors
        - [ ] `npx tsc --noEmit` passes with 0 errors
    validations:
      required: true

  - type: textarea
    id: verification_commands
    attributes:
      label: "6. Verification"
      description: "List the local commands or browser verification steps for the contributor."
      value: |
        ```bash
        # 1. Verify code formatting and linting
        npm run lint

        # 2. Verify strict TypeScript type safety
        npx tsc --noEmit

        # 3. Run automated domain test matrix
        node scratch/run-tests.mjs
        ```
    validations:
      required: true

  - type: textarea
    id: beginner_tips
    attributes:
      label: "Helpful Resources for First-Time Contributors"
      description: "Helpful reference links for this task."
      value: |
        - 📖 Review the [Beginner's Contribution Guide](https://github.com/TheVicky1/Pact_OS/blob/main/docs/CONTRIBUTING-BEGINNERS.md) for a zero-to-PR walkthrough.
        - 🎨 Review the [Design System](https://github.com/TheVicky1/Pact_OS/blob/main/docs/DESIGN_SYSTEM.md) for approved color tokens.
        - 🔧 If you encounter setup issues, see the [Troubleshooting Guide](https://github.com/TheVicky1/Pact_OS/blob/main/docs/TROUBLESHOOTING.md).
    validations:
      required: false
